<h1>XSText</h1>

<p><b>SYNTAX</b>
<pre>
	<b>XSText</b> *txt;
</pre>

<p><b>DESCRIPTION</b>
<blockquote>

	<p><b>XSText</b> is a typedef for a struct with the data necessary
	to text edition of one text paragraph. More text paragraphs can be
	linked in a double linked list of <b>XSText</b>.

	<p><b>XSText</b> support is under construction, see <a
	href="edit.html">XSEdit</a> for a better reference.
	
</blockquote>
